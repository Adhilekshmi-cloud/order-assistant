<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Assistant</title>
<style>
  :root{--bg:#f6f3ee;--panel:#fffdf9;--ink:#1d2433;--muted:#6b7280;--line:#e4ded3;--accent:#0f766e;--accent-ink:#fff;--bot:#f1ece3;--err-bg:#fdecec;--err:#a4161a;--chip:#dcefec;--ok:#16a34a}
  @media (prefers-color-scheme:dark){:root{--bg:#12151b;--panel:#191d25;--ink:#e8e6e1;--muted:#9aa1ad;--line:#2a303b;--accent:#2dd4bf;--accent-ink:#06201d;--bot:#222833;--err-bg:#3a1c1e;--err:#ffb4b4;--chip:#1f3a38;--ok:#4ade80}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center}
  main{width:100%;max-width:780px;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line)}
  header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;letter-spacing:.5px}
  .title{flex:1;min-width:0}
  .title h1{margin:0;font:600 18px Georgia,"Iowan Old Style",serif}
  .title p{margin:2px 0 0;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--ok)} .dot.off{background:var(--err)}
  .ghost{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
  .ghost:hover{border-color:var(--accent);color:var(--accent)}
  #log{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
  .welcome{margin:auto 0;text-align:center}
  .welcome h2{margin:0 0 6px;font:600 26px Georgia,"Iowan Old Style",serif}
  .welcome p{margin:0 auto 20px;max-width:440px;color:var(--muted);font-size:14px;line-height:1.5}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
  .card{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font-size:14px;line-height:1.35;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s}
  .card:hover{border-color:var(--accent);transform:translateY(-1px)}
  .tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--accent)}
  .row{display:flex;animation:in .2s ease-out}
  .row.user{justify-content:flex-end}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .bubble{max-width:84%;padding:11px 15px;border-radius:16px;line-height:1.5;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
  .user .bubble{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
  .bot .bubble{background:var(--bot);border-bottom-left-radius:4px}
  .bubble.err{background:var(--err-bg);color:var(--err);border:1px solid var(--err)}
  .steps{margin-bottom:8px;font-size:12px}
  .steps summary{cursor:pointer;color:var(--muted);font-weight:600;user-select:none}
  .step{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px}
  .tool{font:600 12px ui-monospace,Consolas,monospace;color:var(--accent)}
  .step.bad .tool{color:var(--err)}
  .pill{background:var(--chip);border-radius:999px;padding:2px 8px;font:11px ui-monospace,Consolas,monospace}
  .meta{margin-top:6px;font-size:11px;color:var(--muted)}
  .retry{display:block;margin-top:8px;border:1px solid var(--err);background:transparent;color:var(--err);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
  .dots{display:inline-flex;gap:5px;padding:4px 0}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  form{display:flex;gap:8px;padding:12px 18px 6px;border-top:1px solid var(--line)}
  input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:var(--panel);color:var(--ink)}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  #send{padding:0 20px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  footer{display:flex;justify-content:space-between;padding:0 20px 10px;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <header>
    <div class="logo">OA</div>
    <div class="title">
      <h1>Order Assistant</h1>
      <p><span class="dot" id="dot"></span><span id="status">Connecting...</span> · 60 orders · Jun to Sep 2026</p>
    </div>
    <button class="ghost" id="reset" type="button">New chat</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="f">
    <input id="q" maxlength="500" placeholder="Ask about an order, a customer, revenue..." autocomplete="off" required>
    <button id="send">Send</button>
  </form>
  <footer><span>Answers come from the order data through tool calls.</span><span id="count">0 / 500</span></footer>
</main>
<script>
const $ = id => document.getElementById(id);
const log = $('log'), q = $('q'), send = $('send');
const SUGGESTIONS = [
  ['Look up', 'What is the status of order ORD-1025?'],
  ['Count', 'How many orders were cancelled?'],
  ['Revenue', 'What was the total revenue from Electronics in August?'],
  ['Ranking', 'Which customer has spent the most?'],
  ['Breakdown', 'Show revenue by category'],
  ['List', 'List the returned orders']
];
let history = [], busy = false;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function scrollDown() { log.scrollTop = log.scrollHeight; }
function setBusy(b) { busy = b; send.disabled = b; }

function welcome() {
  log.textContent = '';
  history = [];
  const w = el('div', 'welcome');
  w.appendChild(el('h2', null, 'Ask about your orders'));
  w.appendChild(el('p', null, 'I look up answers in the order data using tools, and show you which ones I used.'));
  const grid = el('div', 'cards');
  SUGGESTIONS.forEach(([tag, text]) => {
    const b = el('button', 'card');
    b.type = 'button';
    b.appendChild(el('span', 'tag', tag));
    b.appendChild(el('span', null, text));
    b.onclick = () => ask(text);
    grid.appendChild(b);
  });
  w.appendChild(grid);
  log.appendChild(w);
}

function renderSteps(steps) {
  const d = el('details', 'steps');
  d.open = true;
  d.appendChild(el('summary', null, 'Used ' + steps.length + (steps.length === 1 ? ' tool' : ' tools')));
  steps.forEach(s => {
    const line = el('div', 'step' + (s.ok ? '' : ' bad'));
    line.appendChild(el('span', 'tool', (s.ok ? '✓ ' : '✗ ') + s.tool));
    Object.entries(s.args || {}).forEach(([k, v]) => line.appendChild(el('span', 'pill', k + ': ' + v)));
    d.appendChild(line);
  });
  return d;
}

async function ask(text, echo = true) {
  text = text.trim();
  if (!text || busy) return;
  const w = log.querySelector('.welcome');
  if (w) w.remove();
  if (echo) {
    const u = el('div', 'row user');
    u.appendChild(el('div', 'bubble', text));
    log.appendChild(u);
  }
  q.value = ''; $('count').textContent = '0 / 500';
  setBusy(true);
  const r = el('div', 'row bot'), b = el('div', 'bubble');
  b.innerHTML = '<span class="dots" aria-label="Thinking"><i></i><i></i><i></i></span>';
  r.appendChild(b); log.appendChild(r); scrollDown();
  const t0 = performance.now();
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 90000);
  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, signal: ctrl.signal,
      body: JSON.stringify({message: text, history: history.slice(-8)})
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const d = data.detail;
      throw new Error(typeof d === 'string' ? d : 'Invalid input. Keep your message between 1 and 500 characters.');
    }
    b.textContent = '';
    if (data.steps && data.steps.length) b.appendChild(renderSteps(data.steps));
    b.appendChild(el('div', null, data.reply));
    b.appendChild(el('div', 'meta', ((performance.now() - t0) / 1000).toFixed(1) + ' s'));
    history.push({role: 'user', content: text}, {role: 'assistant', content: data.reply});
  } catch (e) {
    b.className = 'bubble err';
    b.textContent = e.name === 'AbortError' ? 'Request timed out. Please try again.'
      : e instanceof TypeError ? 'Network error. Check your connection and try again.' : e.message;
    const again = el('button', 'retry', 'Try again');
    again.type = 'button';
    again.onclick = () => { r.remove(); ask(text, false); };
    b.appendChild(again);
  } finally {
    clearTimeout(timer);
    setBusy(false); q.focus(); scrollDown();
  }
}

$('f').addEventListener('submit', e => { e.preventDefault(); ask(q.value); });
$('reset').addEventListener('click', () => { if (!busy) welcome(); });
q.addEventListener('input', () => { $('count').textContent = q.value.length + ' / 500'; });
fetch('/api/health').then(r => { if (!r.ok) throw 0; $('dot').className = 'dot on'; $('status').textContent = 'Online'; })
  .catch(() => { $('dot').className = 'dot off'; $('status').textContent = 'Offline'; });
welcome();
q.focus();
</script>
</body>
</html>
