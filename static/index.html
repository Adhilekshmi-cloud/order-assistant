<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Assistant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='26' font-weight='700' text-anchor='middle' fill='white'%3EOA%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#f6f3ee;--panel:#fffdf9;--ink:#1d2433;--muted:#6b7280;--line:#e4ded3;--accent:#0f766e;--accent-ink:#fff;--bot:#f1ece3;--err-bg:#fdecec;--err:#a4161a;--chip:#dcefec;--ok:#16a34a;--pad:max(18px,calc((100% - 760px)/2))}
  @media (prefers-color-scheme:dark){:root{--bg:#12151b;--panel:#191d25;--ink:#e8e6e1;--muted:#9aa1ad;--line:#2a303b;--accent:#2dd4bf;--accent-ink:#06201d;--bot:#222833;--err-bg:#3a1c1e;--err:#ffb4b4;--chip:#1f3a38;--ok:#4ade80}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
  .app{display:flex;height:100vh;height:100dvh}
  aside{width:264px;flex:none;display:flex;flex-direction:column;gap:10px;padding:14px 12px;background:var(--bg);border-right:1px solid var(--line)}
  .new{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;cursor:pointer;text-align:left}
  .new:hover{background:var(--accent);color:var(--accent-ink)}
  .side-label{margin:6px 4px 0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  #chats{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
  .chat{display:flex;align-items:center;gap:6px;padding:8px 6px 8px 10px;border-radius:8px;font-size:13px;cursor:pointer}
  .chat span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chat:hover,.chat.active{background:var(--bot)}
  .del{border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;padding:2px 6px;border-radius:6px;cursor:pointer;opacity:0}
  .chat:hover .del,.chat:focus-within .del,.chat.active .del{opacity:1}
  .del:hover{color:var(--err)}
  .empty{padding:8px 10px;font-size:13px;color:var(--muted)}
  .side-note{margin:0 4px;font-size:11px;color:var(--muted);line-height:1.4}
  main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel)}
  header{display:flex;align-items:center;gap:12px;padding:14px var(--pad);border-bottom:1px solid var(--line)}
  .menu{display:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;font-size:16px;cursor:pointer}
  .logo{width:38px;height:38px;flex:none;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;letter-spacing:.5px}
  .title{flex:1;min-width:0}
  .title h1{margin:0;font:600 18px Georgia,"Iowan Old Style",serif}
  .title p{margin:2px 0 0;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--ok)} .dot.off{background:var(--err)}
  #log{flex:1;overflow-y:auto;padding:20px var(--pad);display:flex;flex-direction:column;gap:14px}
  .welcome{margin:auto 0;text-align:center}
  .welcome h2{margin:0 0 6px;font:600 26px Georgia,"Iowan Old Style",serif}
  .welcome p{margin:0 auto 20px;max-width:440px;color:var(--muted);font-size:14px;line-height:1.5}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
  .card{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font-size:14px;line-height:1.35;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s}
  .card:hover{border-color:var(--accent);transform:translateY(-1px)}
  .tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--accent)}
  .row{display:flex}
  .row.fresh{animation:in .2s ease-out}
  .row.user{justify-content:flex-end}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .bubble{max-width:84%;padding:11px 15px;border-radius:16px;line-height:1.5;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
  .user .bubble{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
  .bot .bubble{background:var(--bot);border-bottom-left-radius:4px}
  .bubble.err{background:var(--err-bg);color:var(--err);border:1px solid var(--err)}
  .steps{margin-bottom:8px;font-size:12px}
  .steps summary{cursor:pointer;color:var(--muted);font-weight:600;user-select:none}
  .step{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px}
  .tool{font:600 12px ui-monospace,Consolas,monospace;color:var(--accent)}
  .step.bad .tool{color:var(--err)}
  .pill{background:var(--chip);border-radius:999px;padding:2px 8px;font:11px ui-monospace,Consolas,monospace}
  .meta{margin-top:6px;font-size:11px;color:var(--muted)}
  .retry{display:block;margin-top:8px;border:1px solid var(--err);background:transparent;color:var(--err);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
  .dots{display:inline-flex;gap:5px;padding:4px 0}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  form{display:flex;gap:8px;padding:12px var(--pad) 6px;border-top:1px solid var(--line)}
  input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:var(--panel);color:var(--ink)}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  #send{padding:0 20px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  footer{display:flex;justify-content:space-between;gap:10px;padding:0 var(--pad) 10px;font-size:11px;color:var(--muted)}
  .shade{display:none}
  @media (max-width:760px){
    .menu{display:block}
    aside{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s}
    .app.open aside{transform:none}
    .app.open .shade{display:block;position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.4)}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <button class="new" id="new" type="button">+ New chat</button>
    <div class="side-label">History</div>
    <div id="chats"></div>
    <p class="side-note">Chats are saved in this browser only.</p>
  </aside>
  <div class="shade" id="shade"></div>
  <main>
    <header>
      <button class="menu" id="menu" type="button" aria-label="Show chat history">☰</button>
      <div class="logo">OA</div>
      <div class="title">
        <h1>Order Assistant</h1>
        <p><span class="dot" id="dot"></span><span id="status">Connecting...</span> · 60 orders · Jun to Sep 2026</p>
      </div>
    </header>
    <div id="log" aria-live="polite"></div>
    <form id="f">
      <input id="q" maxlength="500" placeholder="Ask about an order, a customer, revenue..." autocomplete="off" required>
      <button id="send">Send</button>
    </form>
    <footer><span>Answers come from the order data through tool calls.</span><span id="count">0 / 500</span></footer>
  </main>
</div>
<script>
const $ = id => document.getElementById(id);
const log = $('log'), q = $('q'), send = $('send'), list = $('chats'), app = $('app');
const KEY = 'order_assistant_chats_v1';
const SUGGESTIONS = [
  ['Look up', 'What is the status of order ORD-1025?'],
  ['Count', 'How many orders were cancelled?'],
  ['Revenue', 'What was the total revenue from Electronics in August?'],
  ['Ranking', 'Which customer has spent the most?'],
  ['Breakdown', 'Show revenue by category'],
  ['List', 'List the returned orders']
];
let chats = loadChats(), currentId = null, busy = false;

function loadChats() {
  try { const v = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
}
function saveChats() {
  try { localStorage.setItem(KEY, JSON.stringify(chats.slice(0, 30))); } catch (e) {}
}
function current() { return chats.find(c => c.id === currentId); }

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function scrollDown() { log.scrollTop = log.scrollHeight; }
function setBusy(b) { busy = b; send.disabled = b; }
function closeSide() { app.classList.remove('open'); }

function renderList() {
  list.textContent = '';
  if (!chats.length) { list.appendChild(el('div', 'empty', 'No chats yet')); return; }
  chats.forEach(c => {
    const item = el('div', 'chat' + (c.id === currentId ? ' active' : ''));
    item.tabIndex = 0;
    item.title = c.title;
    item.appendChild(el('span', null, c.title));
    const d = el('button', 'del', '×');
    d.type = 'button';
    d.setAttribute('aria-label', 'Delete chat');
    d.onclick = e => {
      e.stopPropagation();
      if (busy) return;
      chats = chats.filter(x => x.id !== c.id);
      saveChats();
      if (currentId === c.id) { currentId = null; renderChat(); }
      renderList();
    };
    item.onclick = () => openChat(c.id);
    item.onkeydown = e => { if (e.key === 'Enter') openChat(c.id); };
    item.appendChild(d);
    list.appendChild(item);
  });
}
function openChat(id) {
  if (busy) return;
  currentId = id; renderList(); renderChat(); closeSide();
}
function newChat() {
  if (busy) return;
  currentId = null; renderList(); renderChat(); closeSide(); q.focus();
}

function welcome() {
  const w = el('div', 'welcome');
  w.appendChild(el('h2', null, 'Ask about your orders'));
  w.appendChild(el('p', null, 'I look up answers in the order data using tools, and show you which ones I used.'));
  const grid = el('div', 'cards');
  SUGGESTIONS.forEach(([tag, text]) => {
    const b = el('button', 'card');
    b.type = 'button';
    b.appendChild(el('span', 'tag', tag));
    b.appendChild(el('span', null, text));
    b.onclick = () => ask(text);
    grid.appendChild(b);
  });
  w.appendChild(grid);
  log.appendChild(w);
}

function renderSteps(steps) {
  const d = el('details', 'steps');
  d.open = true;
  d.appendChild(el('summary', null, 'Used ' + steps.length + (steps.length === 1 ? ' tool' : ' tools')));
  steps.forEach(s => {
    const line = el('div', 'step' + (s.ok ? '' : ' bad'));
    line.appendChild(el('span', 'tool', (s.ok ? '✓ ' : '✗ ') + s.tool));
    Object.entries(s.args || {}).forEach(([k, v]) => line.appendChild(el('span', 'pill', k + ': ' + v)));
    d.appendChild(line);
  });
  return d;
}
function addUser(text, fresh) {
  const u = el('div', 'row user' + (fresh ? ' fresh' : ''));
  u.appendChild(el('div', 'bubble', text));
  log.appendChild(u);
}
function fillBot(b, m) {
  b.textContent = '';
  if (m.steps && m.steps.length) b.appendChild(renderSteps(m.steps));
  b.appendChild(el('div', null, m.text));
  if (m.secs) b.appendChild(el('div', 'meta', m.secs + ' s'));
}
function renderChat() {
  log.textContent = '';
  const c = current();
  if (!c || !c.messages.length) { welcome(); return; }
  c.messages.forEach(m => {
    if (m.role === 'user') return addUser(m.text);
    const r = el('div', 'row bot'), b = el('div', 'bubble');
    fillBot(b, m); r.appendChild(b); log.appendChild(r);
  });
  scrollDown();
}

async function ask(text, echo = true) {
  text = text.trim();
  if (!text || busy) return;
  let c = current();
  if (!c) {
    c = {id: Date.now().toString(36), title: text.length > 44 ? text.slice(0, 44) + '…' : text, messages: []};
    currentId = c.id;
  }
  chats = [c, ...chats.filter(x => x.id !== c.id)];
  const w = log.querySelector('.welcome');
  if (w) w.remove();
  if (echo) { c.messages.push({role: 'user', text}); addUser(text, true); }
  saveChats(); renderList();
  const prior = c.messages.slice(0, -1).slice(-8).map(m => ({role: m.role, content: m.text.slice(0, 2000)}));
  q.value = ''; $('count').textContent = '0 / 500';
  setBusy(true);
  const r = el('div', 'row bot fresh'), b = el('div', 'bubble');
  b.innerHTML = '<span class="dots" aria-label="Thinking"><i></i><i></i><i></i></span>';
  r.appendChild(b); log.appendChild(r); scrollDown();
  const t0 = performance.now();
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 90000);
  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, signal: ctrl.signal,
      body: JSON.stringify({message: text, history: prior})
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const d = data.detail;
      throw new Error(typeof d === 'string' ? d : 'Invalid input. Keep your message between 1 and 500 characters.');
    }
    const m = {role: 'assistant', text: data.reply, steps: data.steps || [], secs: ((performance.now() - t0) / 1000).toFixed(1)};
    c.messages.push(m); saveChats();
    fillBot(b, m);
  } catch (e) {
    b.className = 'bubble err';
    b.textContent = e.name === 'AbortError' ? 'Request timed out. Please try again.'
      : e instanceof TypeError ? 'Network error. Check your connection and try again.' : e.message;
    const again = el('button', 'retry', 'Try again');
    again.type = 'button';
    again.onclick = () => { r.remove(); ask(text, false); };
    b.appendChild(again);
  } finally {
    clearTimeout(timer);
    setBusy(false); q.focus(); scrollDown();
  }
}

$('f').addEventListener('submit', e => { e.preventDefault(); ask(q.value); });
$('new').addEventListener('click', newChat);
$('menu').addEventListener('click', () => app.classList.toggle('open'));
$('shade').addEventListener('click', closeSide);
q.addEventListener('input', () => { $('count').textContent = q.value.length + ' / 500'; });
fetch('/api/health').then(r => { if (!r.ok) throw 0; $('dot').className = 'dot on'; $('status').textContent = 'Online'; })
  .catch(() => { $('dot').className = 'dot off'; $('status').textContent = 'Offline'; });
renderList();
renderChat();
q.focus();
</script>
</body>
</html>
